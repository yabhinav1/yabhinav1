name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

# A manual run and the cron must never race each other force-pushing `output`.
concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # SNK_TOKEN is a classic PAT with only the `read:user` scope. With it the
          # calendar includes private contributions; without it the default Actions
          # token is used and only public contributions are drawn.
          github_token: ${{ secrets.SNK_TOKEN || github.token }}
          outputs: |
            dist/github-snake.svg?color_snake=#1f6feb
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58a6ff

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
